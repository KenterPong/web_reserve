<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- 綠色圓角背景 -->
  <rect width="200" height="200" rx="44" fill="#22C55E"/>

  <!-- 日曆本體 -->
  <rect x="40" y="60" width="120" height="100" rx="12" fill="white"/>

  <!-- 日曆頂部綠色欄 -->
  <rect x="40" y="60" width="120" height="32" rx="12" fill="#16A34A"/>
  <rect x="40" y="78" width="120" height="14" fill="#16A34A"/>

  <!-- 日曆孔（左） -->
  <rect x="72" y="48" width="10" height="24" rx="5" fill="#15803D"/>
  <!-- 日曆孔（右） -->
  <rect x="118" y="48" width="10" height="24" rx="5" fill="#15803D"/>

  <!-- 日曆格子第一排 -->
  <rect x="52" y="102" width="18" height="16" rx="4" fill="#22C55E"/>
  <rect x="82" y="102" width="18" height="16" rx="4" fill="#22C55E"/>
  <rect x="112" y="102" width="18" height="16" rx="4" fill="#DCFCE7"/>
  <rect x="142" y="102" width="18" height="16" rx="4" fill="#DCFCE7"/>

  <!-- 日曆格子第二排 -->
  <rect x="52" y="124" width="18" height="16" rx="4" fill="#DCFCE7"/>
  <rect x="82" y="124" width="18" height="16" rx="4" fill="#DCFCE7"/>
  <rect x="112" y="124" width="18" height="16" rx="4" fill="#DCFCE7"/>

  <!-- 對話框（右下角） -->
  <rect x="108" y="126" width="60" height="42" rx="14" fill="#22C55E"/>
  <!-- 對話框尾巴 -->
  <polygon points="116,168 132,168 124,180" fill="#22C55E"/>
  <!-- 對話框點點 -->
  <circle cx="124" cy="147" r="5" fill="white"/>
  <circle cx="138" cy="147" r="5" fill="white"/>
  <circle cx="152" cy="147" r="5" fill="white"/>
</svg>
